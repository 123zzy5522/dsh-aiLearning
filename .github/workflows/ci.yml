name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run: CI minutes are not free
# and an outdated run cannot approve anything anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Syntax, import boundaries, plugin manifests
        run: npm run check

      # The committed bundle is what DSH loads; a stale one means the shipped
      # plugin differs from the source. Rebuild and require a clean diff.
      - name: Client bundle is up to date
        run: |
          npm run build:client
          git diff --exit-code -- client.js

      - name: Unit tests
        run: npm run test

      - name: Smoke test (no model, no Python)
        run: npm run smoke
